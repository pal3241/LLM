[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minillm"
version = "0.1.0"
description = "A small-to-2B decoder-only Transformer learning project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.2", "tokenizers>=0.15"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["minillm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
